<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Skincare</title>
<meta name="description" content="Mis rutinas de cuidado facial de mañana y noche">
<meta name="theme-color" content="#F4F2F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141116" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Skincare">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,0..100&display=swap">
<style>
/* ===== Mi Skincare · estilos ===== */
:root{
  --bg:#F4F2F6; --card:#FFFFFF; --card-2:#FAF8FB; --ink:#2B2530; --muted:#756E7D; --line:#ECE6EF;
  --pink:#DD4674; --pink-ink:#C12D5C; --pink-soft:#FCE6EE; --pink-softer:#FFF3F7;
  --hero-a:#F27CA2; --hero-b:#E45581; --on-pink:#FFFFFF;
  --am:#F6D35B; --am-ink:#4A3A00; --pm:#90BBF3; --pm-ink:#0F3563; --both:#86D29F; --both-ink:#0D4424;
  --warn:#B25B00; --warn-soft:#FFF1DE; --err:#B3261E; --err-soft:#FDE7E5; --ok:#1E7A45;
  --hatch:#E7E2EA; --shadow:0 1px 2px rgba(60,30,50,.05),0 4px 16px rgba(60,30,50,.05);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --tab-h:64px; --fs:16px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not(.app-light){
    --bg:#141116; --card:#1F1A22; --card-2:#262029; --ink:#F2ECF4; --muted:#A99FB0; --line:#332C37;
    --pink:#EE6F97; --pink-ink:#F58CAE; --pink-soft:#3B1E2A; --pink-softer:#2A1820;
    --hero-a:#C94E77; --hero-b:#A93A62; --on-pink:#FFFFFF;
    --am:#E3BF46; --am-ink:#2A2000; --pm:#6F9EE0; --pm-ink:#07203F; --both:#5FBA7E; --both-ink:#062A13;
    --warn:#F0A650; --warn-soft:#3A2710; --err:#FF8A80; --err-soft:#3D1B19; --ok:#6FD39A;
    --hatch:#2C2630; --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"], :root.app-dark{
  --bg:#141116; --card:#1F1A22; --card-2:#262029; --ink:#F2ECF4; --muted:#A99FB0; --line:#332C37;
  --pink:#EE6F97; --pink-ink:#F58CAE; --pink-soft:#3B1E2A; --pink-softer:#2A1820;
  --hero-a:#C94E77; --hero-b:#A93A62; --on-pink:#FFFFFF;
  --am:#E3BF46; --am-ink:#2A2000; --pm:#6F9EE0; --pm-ink:#07203F; --both:#5FBA7E; --both-ink:#062A13;
  --warn:#F0A650; --warn-soft:#3A2710; --err:#FF8A80; --err-soft:#3D1B19; --ok:#6FD39A;
  --hatch:#2C2630; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
:root.app-light{
  --bg:#F4F2F6; --card:#FFFFFF; --card-2:#FAF8FB; --ink:#2B2530; --muted:#756E7D; --line:#ECE6EF;
  --pink:#DD4674; --pink-ink:#C12D5C; --pink-soft:#FCE6EE; --pink-softer:#FFF3F7;
  --hero-a:#F27CA2; --hero-b:#E45581; --on-pink:#FFFFFF;
  --am:#F6D35B; --am-ink:#4A3A00; --pm:#90BBF3; --pm-ink:#0F3563; --both:#86D29F; --both-ink:#0D4424;
  --warn:#B25B00; --warn-soft:#FFF1DE; --err:#B3261E; --err-soft:#FDE7E5; --ok:#1E7A45;
  --hatch:#E7E2EA; --shadow:0 1px 2px rgba(60,30,50,.05),0 4px 16px rgba(60,30,50,.05);
  color-scheme:light;
}
:root.ts-l{--fs:18px} :root.ts-xl{--fs:20px}
html{font-size:var(--fs);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

#app{max-width:620px;margin:0 auto;padding-inline:16px;padding-top:calc(env(safe-area-inset-top) + 14px);padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 28px)}
#view{display:flex;flex-direction:column;gap:14px;outline:none}

/* banners */
.banner{border-radius:var(--r-md);padding:8px 8px 8px 14px;font-size:.8rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.banner.demo{background:repeating-linear-gradient(-45deg,var(--pink-soft) 0 10px,var(--pink-softer) 10px 20px);color:var(--pink-ink);font-weight:600;border:1px dashed var(--pink)}
.banner.err{background:var(--err-soft);color:var(--err);font-weight:600}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner button{border:0;background:var(--card);color:var(--pink-ink);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.85rem}

/* page titles */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 2px 2px}
.page-h h1{font-family:var(--display);font-weight:600;font-size:2rem;letter-spacing:-.01em;font-variation-settings:"SOFT" 100,"opsz" 72}
.page-h .sub{color:var(--muted);font-size:.9rem}

/* cards */
.card{background:var(--card);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:1.08rem;font-weight:700}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:999px;border:0;font-weight:700;background:var(--pink);color:var(--on-pink);font-size:.98rem}
.btn:active{transform:scale(.98)}
.btn.soft{background:var(--pink-soft);color:var(--pink-ink)}
.btn.ghost{background:transparent;color:var(--pink-ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--err-soft);color:var(--err)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 14px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{border:0;background:none;color:var(--pink-ink);font-weight:600;padding:6px 2px;font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--card-2);display:inline-grid;place-items:center;color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700;background:var(--card-2);color:var(--muted);white-space:nowrap}
.pill.pink{background:var(--pink-soft);color:var(--pink-ink)}
.pill.next{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:color-mix(in srgb,var(--both) 35%,transparent);color:var(--ok)}

/* day header (Hoy) */
.dayhead{background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:var(--on-pink);border-radius:var(--r-lg);padding:14px 10px 16px;display:flex;flex-direction:column;gap:12px}
.dh-row{display:grid;grid-template-columns:64px 1fr 64px;align-items:center}
.dh-nav{border:0;background:transparent;color:inherit;opacity:.85;display:flex;flex-direction:column;align-items:center;padding:6px 0;border-radius:14px;min-height:52px;justify-content:center}
.dh-nav:hover{background:rgba(255,255,255,.12)}
.dh-nav b{font-size:.95rem;font-weight:600}
.dh-nav span{font-size:.72rem;opacity:.9}
.dh-center{text-align:center}
.dh-center h1{font-family:var(--display);font-weight:600;font-size:2.15rem;line-height:1.05;font-variation-settings:"SOFT" 100,"opsz" 72}
.dh-center p{font-size:.92rem;opacity:.95;margin-top:4px}
.dh-center p::first-letter{text-transform:uppercase}
.dh-sum{background:rgba(255,255,255,.17);border-radius:var(--r-md);padding:10px 14px;display:flex;align-items:center;gap:12px;margin-inline:6px}
.dh-sum strong{display:block;font-size:1rem}
.dh-sum span{font-size:.86rem;opacity:.95}
.dh-sum .grow{flex:1}
.dh-dots{display:flex;gap:6px}
.dh-dots i{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-style:normal}
.dh-dots i.on{background:#fff;color:var(--hero-b)}
.dh-dots i svg{width:15px;height:15px}
.backtoday{border:0;background:#fff;color:var(--pink-ink);font-weight:700;border-radius:999px;padding:8px 14px;font-size:.85rem;white-space:nowrap}
.note{border-radius:var(--r-sm);padding:10px 12px;font-size:.88rem;background:var(--card-2);color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.pink{background:var(--pink-softer);color:var(--pink-ink)}

/* routine cards */
.routine .rt-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rt-title{display:flex;align-items:center;gap:10px}
.rt-emoji{font-size:1.5rem;line-height:1}
.rt-title h2{font-size:1.15rem}
.rt-meta{font-size:.82rem;color:var(--muted);margin-top:1px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:var(--pink);border-radius:99px;transition:width .25s ease}
.routine.am.complete .bar i{background:var(--am)} .routine.pm.complete .bar i{background:var(--pm)}
.steps{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:44px 48px 1fr 40px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.check{width:40px;height:40px;border-radius:50%;border:2px solid color-mix(in srgb,var(--pink) 55%,var(--line));background:var(--card);display:grid;place-items:center;color:transparent;padding:0;transition:background .15s}
.check svg{width:22px;height:22px}
.check[aria-checked="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.check[disabled]{opacity:.4;cursor:not-allowed}
.thumb{width:48px;height:48px;border-radius:14px;background:var(--pink-soft);color:var(--pink-ink);display:grid;place-items:center;overflow:hidden;font-weight:800;font-size:1.05rem;position:relative;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ord{position:absolute;left:3px;top:3px;background:var(--card);color:var(--ink);font-size:.62rem;font-weight:800;border-radius:6px;padding:0 4px;line-height:1.4;box-shadow:0 0 0 1px var(--line)}
.st-text{min-width:0}
.st-text strong{display:block;font-weight:650;overflow-wrap:anywhere}
.st-text span{display:block;font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.step.done .st-text strong{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--pink) 60%,transparent)}
.info-btn{width:38px;height:38px;border-radius:50%;border:0;background:var(--card-2);color:var(--muted);display:grid;place-items:center}
.info-btn[aria-expanded="true"]{background:var(--pink-soft);color:var(--pink-ink)}
.st-info{grid-column:1/-1;background:var(--card-2);border-radius:var(--r-sm);padding:10px 12px;font-size:.9rem;display:flex;flex-direction:column;gap:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.st-info b{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
.rt-foot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.empty{padding:14px;border-radius:var(--r-sm);background:var(--card-2);color:var(--muted);font-size:.92rem;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}

/* calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cal-nav h2{font-size:1.08rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:.74rem;font-weight:700;color:var(--muted);padding:2px 0 4px}
.cell{position:relative;border:0;border-radius:12px;background:transparent;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;color:var(--ink);font-variant-numeric:tabular-nums;max-width:100%}
.cal.big .cell{aspect-ratio:auto;min-height:58px;border-radius:14px}
.cell .n{font-size:.95rem;font-weight:650;line-height:1}
.cal.big .cell .n{font-size:1.1rem}
.cell .sym{height:14px;display:grid;place-items:center}
.cell .sym svg{width:13px;height:13px}
.cal.big .cell .sym{height:16px} .cal.big .cell .sym svg{width:15px;height:15px}
.cell .tl{font-size:.6rem;font-weight:700;line-height:1}
.cell.past,.cell.today{background:var(--card-2)}
.cell.fill-am{background:var(--am);color:var(--am-ink)}
.cell.fill-pm{background:var(--pm);color:var(--pm-ink)}
.cell.fill-both{background:var(--both);color:var(--both-ink)}
.cell.future{color:color-mix(in srgb,var(--muted) 75%,transparent);background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.cell.before{color:color-mix(in srgb,var(--muted) 70%,transparent);background:repeating-linear-gradient(-45deg,var(--hatch) 0 3px,transparent 3px 8px)}
.cell.missed .sym{color:var(--muted)}
.cell.partial-only .sym{color:var(--pink-ink)}
.cell .pdot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 1.5px var(--card)}
.cell.today{box-shadow:inset 0 0 0 2.5px var(--pink)}
.cell.selected:not(.today){box-shadow:inset 0 0 0 2px var(--ink)}
.cell.today.selected{box-shadow:inset 0 0 0 2.5px var(--pink),0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.cell.blank{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:18px;border-radius:6px;display:inline-grid;place-items:center;flex:none}
.sw svg{width:11px;height:11px}
.sw.am{background:var(--am);color:var(--am-ink)} .sw.pm{background:var(--pm);color:var(--pm-ink)} .sw.both{background:var(--both);color:var(--both-ink)}
.sw.part{background:var(--card-2);color:var(--pink-ink)} .sw.miss{background:var(--card-2);color:var(--muted)}
.sw.fut{box-shadow:inset 0 0 0 1px var(--line)} .sw.bef{background:repeating-linear-gradient(-45deg,var(--hatch) 0 3px,transparent 3px 7px)}
.sw.tod{box-shadow:inset 0 0 0 2.5px var(--pink)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum-tile{background:var(--card-2);border-radius:var(--r-sm);padding:10px;display:flex;flex-direction:column;gap:2px}
.sum-tile b{font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.1}
.sum-tile small{color:var(--muted);font-size:.78rem}
.sum-tile .k{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700}
.goalbar{position:relative;height:10px;border-radius:99px;background:var(--line);margin-top:8px}
.goalbar i{position:absolute;inset:0 auto 0 0;background:var(--pink);border-radius:99px}
.goalbar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}

/* products */
.search{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chipbtn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:.86rem;font-weight:600;white-space:nowrap;color:var(--ink)}
.chipbtn[aria-pressed="true"]{background:var(--pink-soft);border-color:transparent;color:var(--pink-ink)}
.plist{display:flex;flex-direction:column;gap:10px}
.pcard{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:var(--r-md);padding:12px;border:0;text-align:left;box-shadow:var(--shadow);width:100%}
.pcard .thumb{width:56px;height:56px}
.pcard strong{display:block;font-weight:700;overflow-wrap:anywhere}
.pcard .meta{font-size:.84rem;color:var(--muted);display:block}
.pcard .pao{font-size:.78rem;margin-top:3px;display:block;color:var(--muted)}
.pcard .pao.over{color:var(--warn);font-weight:700}
.pcard.archived{opacity:.7;box-shadow:none;border:1.5px dashed var(--line)}

/* routine planner */
.daytabs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daytab{border:0;border-radius:14px;background:var(--card-2);padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;color:var(--ink)}
.daytab[aria-selected="true"]{background:var(--pink);color:var(--on-pink)}
.daytab .dd{display:flex;gap:3px}
.daytab .dd i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.daytab .dd i.a{background:var(--am)} .daytab .dd i.p{background:var(--pm)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card-2);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;min-height:40px;font-weight:700;color:var(--muted);font-size:.92rem;padding:0 8px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--pink-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.edlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ed-step{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;background:var(--card-2);border-radius:var(--r-md);padding:10px}
.ed-actions{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.ed-actions button{border:0;background:var(--card);border-radius:10px;min-height:36px;min-width:40px;padding:0 10px;font-weight:600;font-size:.85rem;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.ed-actions button[disabled]{opacity:.35}
.ed-actions .del{color:var(--err)}
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.vlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.vlist li:first-child{border-top:0}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-weight:650;font-size:.9rem}
.field .hint{font-size:.8rem;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;min-height:46px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--card);padding:10px 12px;font-size:1rem;color:var(--ink)}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--pink);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.photo-edit{display:flex;gap:12px;align-items:center}
.photo-edit .thumb{width:72px;height:72px;border-radius:18px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.lv{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600;color:var(--ink);min-height:36px}
.lv[aria-pressed="true"]{background:var(--pink-soft);border-color:var(--pink);color:var(--pink-ink)}
.skin-row{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.skin-row:first-of-type{border-top:0}
.checklist{display:flex;flex-direction:column;gap:6px}
.checklist label{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r-sm);background:var(--card-2);font-weight:600}
.checklist input{width:20px;height:20px;accent-color:var(--pink)}

/* Yo */
.me{display:flex;gap:14px;align-items:center}
.avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:1.9rem;font-weight:600;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.menu{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.menu>li{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.menu>li:first-child{border-top:0;padding-top:2px}
.mi-h{display:flex;gap:12px;align-items:center}
.mi-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--pink-soft);color:var(--pink-ink)}
.mi-ic svg{width:19px;height:19px}
.mi-h strong{flex:1;font-weight:650}
.opt{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.88rem}
.opt dt{font-weight:700}
.opt dd{margin:0;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.kv span:last-child{color:var(--muted);text-align:right}

.howto{margin:0;padding:0;list-style:none;counter-reset:h;display:flex;flex-direction:column;gap:10px;font-size:.95rem}
.howto li{counter-increment:h;position:relative;padding-left:38px;min-height:26px;padding-top:1px}
.howto li::before{content:counter(h);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--pink-soft);color:var(--pink-ink);font-weight:800;font-size:.82rem;display:grid;place-items:center}
.howto li>span.muted{display:block;font-size:.85rem;margin-top:3px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar ul{list-style:none;margin:0 auto;padding:0 6px;max-width:620px;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
.tabbar button{width:100%;height:100%;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:.72rem;font-weight:650}
.tabbar svg{width:25px;height:25px}
.tabbar button[aria-current="page"]{color:var(--pink-ink)}
.tabbar button[aria-current="page"] .tab-ic{background:var(--pink-soft)}
.tab-ic{border-radius:999px;padding:2px 12px;display:grid;place-items:center}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(20,10,20,.38);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .22s ease}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:24px;max-height:88vh}}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-8px;background:var(--bg);padding:8px 0;z-index:2}
.sheet-h h2{font-size:1.2rem;font-weight:750}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 14px);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:.9rem;font-weight:600;max-width:min(92vw,520px);box-shadow:0 6px 24px rgba(0,0,0,.2);pointer-events:none}
.toast.error{background:var(--err);color:#fff}
.toast[hidden]{display:none!important}
.reduce *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:900px){ .cal.big .cell{min-height:68px} }

<noscript><p style="padding:20px">Mi Skincare necesita JavaScript activado.</p></noscript>

<script>
(function(){
/* ===== Mi Skincare · núcleo: fechas, almacenamiento y reglas de datos ===== */
'use strict';
const APP_VERSION = '0.2.0';
const KEY = 'miSkincare.v1';
const CATS = ['Limpiador','Desmaquillante','Tónico','Esencia','Sérum','Tratamiento','Contorno de ojos','Hidratante','Aceite','Protector solar','Exfoliante','Mascarilla','Otro'];
const SLOTS = { am:{label:'Rutina de mañana', short:'Mañana', emoji:'☀️'}, pm:{label:'Rutina de noche', short:'Noche', emoji:'🌙'} };
const DAYS = ['', 'Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DSH = ['', 'L','M','X','J','V','S','D'];
const SKIN = [['dry','Sequedad'],['oily','Sensación grasa'],['red','Rojeces'],['spots','Granitos'],['sens','Sensibilidad']];
const LEVELS = ['No','Leve','Moderada','Intensa'];

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const dow = k => { const g = parseKey(k).getDay(); return g === 0 ? 7 : g; };
const isKey = k => typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k);
const ymOf = k => k.slice(0, 7);
const addMonths = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1, 12); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const fmt = (k, o) => new Intl.DateTimeFormat('es-ES', o).format(parseKey(k));
const fmtLong = k => fmt(k, {weekday:'long', day:'numeric', month:'long', year:'numeric'});
const fmtShort = k => fmt(k, {day:'numeric', month:'short', year:'numeric'});
const fmtDM = k => fmt(k, {weekday:'short', day:'numeric', month:'short'});
const fmtMonth = ym => cap(new Intl.DateTimeFormat('es-ES', {month:'long', year:'numeric'}).format(parseKey(ym + '-01')));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const emptyWeek = () => { const w = {}; for (let d = 1; d <= 7; d++) w[d] = {am: [], pm: []}; return w; };

/* ---------- almacenamiento (localStorage con verificación) ---------- */
const store = {
  persistent: true, blocked: false, mem: new Map(),
  init() {
    try { const t = KEY + '.__test'; localStorage.setItem(t, '1'); const ok = localStorage.getItem(t) === '1'; localStorage.removeItem(t); this.persistent = ok; }
    catch (e) { this.persistent = false; }
  },
  get(k) { if (!this.persistent) return this.mem.has(k) ? this.mem.get(k) : null; try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) {
    if (!this.persistent) { this.mem.set(k, v); return; }
    localStorage.setItem(k, v);
    if (localStorage.getItem(k) !== v) throw new Error('la comprobación de lectura no coincide');
  },
  del(k) { if (!this.persistent) { this.mem.delete(k); return; } try { localStorage.removeItem(k); } catch (e) {} },
  keys(prefix) {
    if (!this.persistent) return [...this.mem.keys()].filter(k => k.startsWith(prefix));
    const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(prefix)) out.push(k); } } catch (e) {} return out;
  },
  bytes(prefix) { let n = 0; for (const k of this.keys(prefix)) n += (k.length + (this.get(k) || '').length) * 2; return n; }
};
const dataKey = mode => `${KEY}.data.${mode}`;
const photoPrefix = mode => `${KEY}.photo.${mode}.`;
const metaKey = `${KEY}.meta`;

/* ---------- estado ---------- */
let meta = { mode: 'real', theme: 'system', text: 'normal', reduce: false };
let D = null;            // conjunto de datos activo (real o demo)
let photos = {};         // id -> dataURL
let saveState = { ok: true, at: null, msg: '' };
let loadProblem = null;  // texto si los datos guardados no se pudieron leer

function emptyData() {
  const t = todayKey();
  return { schema: 1, createdAt: new Date().toISOString(), profile: { name: '', avatar: null, goal: 80, trackingStart: t, reminders: { am: '08:00', pm: '22:00' } },
    products: [], plans: [], overrides: {}, logs: {}, lastExport: null };
}
function normalize(d) {
  const e = emptyData();
  d.schema = 1;
  d.profile = Object.assign(e.profile, d.profile || {});
  d.profile.reminders = Object.assign({ am: '08:00', pm: '22:00' }, d.profile.reminders || {});
  d.products = Array.isArray(d.products) ? d.products : [];
  d.plans = (Array.isArray(d.plans) ? d.plans : []).filter(p => isKey(p.from)).sort((a, b) => a.from < b.from ? -1 : a.from > b.from ? 1 : 0);
  for (const p of d.plans) { const w = emptyWeek(); for (let i = 1; i <= 7; i++) { const src = p.week?.[i] || {}; w[i] = { am: Array.isArray(src.am) ? src.am : [], pm: Array.isArray(src.pm) ? src.pm : [] }; } p.week = w; }
  d.overrides = d.overrides && typeof d.overrides === 'object' ? d.overrides : {};
  d.logs = d.logs && typeof d.logs === 'object' ? d.logs : {};
  return d;
}
function loadMeta() { try { const m = JSON.parse(store.get(metaKey) || 'null'); if (m) meta = Object.assign(meta, m); } catch (e) {} }
function saveMeta() { try { store.set(metaKey, JSON.stringify(meta)); } catch (e) {} }
function loadData(mode) {
  loadProblem = null; store.blocked = false;
  const raw = store.get(dataKey(mode));
  if (!raw) { D = mode === 'demo' ? makeDemo() : emptyData(); if (mode === 'demo') save(); }
  else {
    try { D = normalize(JSON.parse(raw)); }
    catch (e) { loadProblem = raw; store.blocked = true; D = emptyData(); }
  }
  photos = {};
  for (const k of store.keys(photoPrefix(mode))) photos[k.slice(photoPrefix(mode).length)] = store.get(k);
}
function save() {
  if (store.blocked) { saveState = { ok: false, at: null, msg: 'Los datos guardados no se pudieron leer, así que no se sobrescriben.' }; return false; }
  try { store.set(dataKey(meta.mode), JSON.stringify(D)); saveState = { ok: true, at: new Date(), msg: '' }; return true; }
  catch (e) {
    const quota = e && (e.name === 'QuotaExceededError' || e.code === 22);
    saveState = { ok: false, at: saveState.at, msg: quota ? 'No queda espacio de almacenamiento en este navegador.' : 'Error al guardar: ' + (e.message || e) };
    if (typeof toast === 'function') toast('No se ha podido guardar. ' + saveState.msg, 'error');
    return false;
  }
}
function savePhoto(dataUrl) {
  const id = 'ph_' + uid();
  try { store.set(photoPrefix(meta.mode) + id, dataUrl); photos[id] = dataUrl; return id; }
  catch (e) { toast('No se ha podido guardar la foto: no queda espacio. El resto de datos no cambia.', 'error'); return null; }
}
function deletePhoto(id) { if (!id) return; store.del(photoPrefix(meta.mode) + id); delete photos[id]; }

/* ---------- reglas de planificación ---------- */
const product = id => D.products.find(p => p.id === id);
function planAt(date) { let p = null; for (const v of D.plans) { if (v.from <= date) p = v; else break; } return p; }
function nextPlanAfter(date) { return D.plans.find(v => v.from > date) || null; }
function weekSteps(plan, dayN, slot) { return plan?.week?.[dayN]?.[slot] || []; }

// Pasos previstos para una fecha y rutina.
// Prioridad: cambio de solo esa fecha > registro histórico (días pasados) > planificación semanal vigente en esa fecha.
function resolve(date, slot) {
  const ov = D.overrides[date];
  if (ov && Array.isArray(ov[slot])) return { steps: ov[slot], source: 'override' };
  return baseResolve(date, slot);
}
function baseResolve(date, slot) {
  const lg = D.logs[date]?.[slot];
  if (date < todayKey() && Array.isArray(lg?.snap)) return { steps: lg.snap, source: 'history' };
  return { steps: weekSteps(planAt(date), dow(date), slot), source: 'plan' };
}
function slotStat(date, slot) {
  const r = resolve(date, slot);
  const done = D.logs[date]?.[slot]?.done || {};
  let n = 0; for (const s of r.steps) if (done[s.id]) n++;
  return { ...r, total: r.steps.length, done: n, doneMap: done, complete: r.steps.length > 0 && n === r.steps.length };
}
function dayInfo(date) {
  const t = todayKey();
  const when = date > t ? 'future' : date < D.profile.trackingStart ? 'before' : date === t ? 'today' : 'past';
  const am = slotStat(date, 'am'), pm = slotStat(date, 'pm');
  const fill = am.complete && pm.complete ? 'both' : am.complete ? 'am' : pm.complete ? 'pm' : null;
  const partial = (am.done > 0 && !am.complete) || (pm.done > 0 && !pm.complete);
  return { date, when, am, pm, fill, partial, any: am.done + pm.done > 0, scheduled: am.total + pm.total > 0 };
}
function canMark(date) { if (date > todayKey()) return 'future'; if (date < D.profile.trackingStart) return 'before'; return true; }

function snapOf(steps) {
  return steps.map(s => {
    const p = product(s.productId);
    const o = { id: s.id, productId: s.productId || null, title: s.title || '', instructions: s.instructions || '' };
    const pn = s.pName ?? p?.name, pb = s.pBrand ?? p?.brand, pi = s.pInstr ?? p?.instructions;
    if (s.productId) { o.pName = pn ?? '(producto eliminado)'; o.pBrand = pb ?? ''; o.pInstr = pi ?? ''; }
    return o;
  });
}
function setDone(date, slot, ids, value) {
  const c = canMark(date);
  if (c !== true) { toast(c === 'future' ? 'Las fechas futuras no se pueden marcar como realizadas.' : 'Esta fecha es anterior al inicio del seguimiento. Puedes adelantar el inicio en Yo.'); return false; }
  const r = resolve(date, slot);
  const L = D.logs[date] || (D.logs[date] = {});
  const S = L[slot] || (L[slot] = { done: {} });
  S.done = S.done || {};
  if (r.source === 'plan') S.snap = snapOf(r.steps);     // guarda lo que figuraba ese día
  for (const id of ids) { if (value) S.done[id] = Date.now(); else delete S.done[id]; }
  return save();
}
function refreshTodaySnap() {
  const t = todayKey();
  for (const slot of ['am', 'pm']) { const S = D.logs[t]?.[slot]; if (!S) continue; const r = resolve(t, slot); if (r.source === 'plan') S.snap = snapOf(r.steps); }
}
// Tras cambiar la planificación desde una fecha: los días pasados SIN casillas marcadas pasan a mostrar la nueva planificación;
// los que tienen algo marcado conservan lo que figuraba entonces.
function afterPlanChange(from) {
  const t = todayKey();
  for (const [date, L] of Object.entries(D.logs)) {
    if (date < from || date >= t) continue;
    for (const slot of ['am', 'pm']) { const S = L[slot]; if (S && !Object.keys(S.done || {}).length) delete L[slot]; }
  }
  refreshTodaySnap();
}
function ensureVersion(from) {
  // La primera planificación se aplica desde el inicio del seguimiento.
  if (!D.plans.length && D.profile.trackingStart < from) from = D.profile.trackingStart;
  let v = D.plans.find(p => p.from === from);
  if (!v) {
    const base = planAt(from);
    v = { id: uid(), from, week: clone(base?.week || emptyWeek()), createdAt: new Date().toISOString() };
    D.plans.push(v); D.plans.sort((a, b) => a.from < b.from ? -1 : 1);
  }
  return v;
}
// Al renombrar o cambiar instrucciones de un producto, se fija lo que figuraba en los días pasados.
function freezeProductHistory(pid) {
  const t = todayKey();
  let start = D.profile.trackingStart;
  if (D.plans[0] && D.plans[0].from < start) start = D.plans[0].from;
  let guard = 0;
  for (let d = start; d < t && guard < 1500; d = addDays(d, 1), guard++) {
    for (const slot of ['am', 'pm']) {
      const r = resolve(d, slot);
      if (r.source === 'history') continue;
      if (!r.steps.some(s => s.productId === pid && s.pName === undefined)) continue;
      if (r.source === 'override') D.overrides[d][slot] = snapOf(r.steps);
      else { const L = D.logs[d] || (D.logs[d] = {}); const S = L[slot] || (L[slot] = { done: {} }); S.snap = snapOf(r.steps); S.frozen = true; }
    }
  }
}

/* ---------- resumen mensual ---------- */
function monthSummary(ym) {
  const [y, m] = ym.split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  const s = { amC: 0, amT: 0, pmC: 0, pmT: 0, both: 0, counted: 0 };
  for (let i = 1; i <= days; i++) {
    const k = `${ym}-${pad(i)}`; const inf = dayInfo(k);
    if (inf.when === 'future' || inf.when === 'before') continue;
    s.counted++;
    for (const slot of ['am', 'pm']) {
      const st = inf[slot]; if (!st.total) continue;
      if (inf.when === 'today' && !st.complete) continue; // hoy aún está en curso: no cuenta como incumplido
      s[slot + 'T']++; if (st.complete) s[slot + 'C']++;
    }
    if (inf.fill === 'both') s.both++;
  }
  const T = s.amT + s.pmT; s.pct = T ? Math.round((s.amC + s.pmC) / T * 100) : null;
  return s;
}

/* ---------- datos de demostración (ficticios) ---------- */
function makeDemo() {
  const t = todayKey(); const d = emptyData();
  d.demo = true; d.profile.name = 'Usuaria demo'; d.profile.trackingStart = addDays(t, -24);
  const P = (name, category, instructions = '') => { const p = { id: 'demo_' + uid(), name, brand: 'Marca ficticia', category, photo: null, instructions, notes: 'Producto de demostración: no es una recomendación.', opened: '', paoMonths: '', archived: false, createdAt: new Date().toISOString() }; d.products.push(p); return p; };
  const a = P('DEMO Limpiador A', 'Limpiador', 'Texto de ejemplo. Aquí irán tus propias instrucciones.');
  const b = P('DEMO Sérum B', 'Sérum');
  const c = P('DEMO Crema C', 'Hidratante');
  const e = P('DEMO Protector D', 'Protector solar');
  const f = P('DEMO Tratamiento E', 'Tratamiento', 'Ejemplo de instrucciones personales.');
  const g = P('DEMO Mascarilla F', 'Mascarilla');
  g.opened = addDays(t, -400); g.paoMonths = 12;
  c.opened = addDays(t, -40); c.paoMonths = 6;
  const st = (p, title) => ({ id: uid(), productId: p.id, title, instructions: '' });
  const week = emptyWeek();
  for (let i = 1; i <= 7; i++) {
    week[i].am = [st(a, 'Limpieza'), st(b, 'Sérum'), st(c, 'Hidratación'), st(e, 'Protección')];
    week[i].pm = [st(a, 'Limpieza'), st(c, 'Hidratación')];
  }
  week[2].pm.splice(1, 0, st(f, 'Tratamiento')); week[5].pm.splice(1, 0, st(f, 'Tratamiento'));
  week[7].pm.splice(1, 0, st(g, 'Mascarilla'));
  d.plans.push({ id: uid(), from: d.profile.trackingStart, week, createdAt: new Date().toISOString() });
  // registros ficticios para ver los colores del calendario
  D = d;
  const pattern = ['both', 'am', 'pm', 'both', 'partial', 'none', 'both', 'am', 'both', 'pm'];
  for (let i = 24, j = 0; i >= 1; i--, j++) {
    const k = addDays(t, -i); const kind = pattern[j % pattern.length];

    for (const slot of ['am', 'pm']) {

  }

}

function cellHTML(k, ctx) {
  const inf = dayInfo(k);
  const cls = ['cell', inf.when];
  let sym = '';
  const aria = [fmt(k, { weekday: 'long', day: 'numeric', month: 'long' })];
  if (inf.fill) { cls.push('fill-' + inf.fill); sym = inf.fill === 'both' ? I.check : inf.fill === 'am' ? I.sun : I.moon; }
  if (inf.when === 'future') aria.push('fecha futura');
  else if (inf.when === 'before') aria.push('antes del inicio del seguimiento');
  else {
    if (inf.fill === 'both') aria.push('mañana y noche completadas');

    else if (inf.fill === 'pm') aria.push('noche completada');
    if (inf.partial) aria.push('algunos pasos realizados');
    if (!inf.fill && inf.partial) { cls.push('partial-only'); sym = I.half; }
    if (!inf.fill && !inf.partial && inf.when === 'past') {
      if (inf.scheduled) { cls.push('missed'); sym = I.dash; aria.push('sin registro'); } else aria.push('sin pasos previstos');
    }
  }
  if (k === ui.date && ctx === 'hoy') cls.push('selected');
  if (inf.when === 'today') { cls.push('today'); aria.push('hoy'); }

}
function calGrid(ym, ctx) {
  const [y, m] = ym.split('-').map(Number);
  const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7, days = new Date(y, m, 0).getDate();

/* ===== Mi Skincare · hojas, acciones y arranque ===== */
const LIVE = new Set(['override', 'day']);
const topSheet = kind => { for (let i = ui.sheets.length - 1; i >= 0; i--) if (!kind || ui.sheets[i].kind === kind) return ui.sheets[i]; return null; };
const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };

/* ---------- objetivo de edición de pasos ---------- */
function target(ctx) {
  if (ctx === 'plan') return { type: 'plan', from: ui.editFrom, day: ui.rDay, slot: ui.rSlot };
  const sh = topSheet('override'); return { type: 'ov', date: sh.date, slot: sh.slot };
}
function getList(tg) { return tg.type === 'plan' ? weekSteps(planAt(tg.from), tg.day, tg.slot) : resolve(tg.date, tg.slot).steps; }
function mutate(tg, fn) {
  if (tg.type === 'plan') { const v = ensureVersion(tg.from); if (v.from !== tg.from) ui.editFrom = v.from; fn(v.week[tg.day][tg.slot]); afterPlanChange(v.from); }
  else {
    const o = D.overrides[tg.date] || (D.overrides[tg.date] = {});
    if (!Array.isArray(o[tg.slot])) o[tg.slot] = clone(baseResolve(tg.date, tg.slot).steps);
    fn(o[tg.slot]);
  }
  save();
}

function readImage(file) {
  return new Promise((res, rej) => {
    if (!file || !/^image\//.test(file.type || 'image/')) return rej(new Error('El archivo no es una imagen.'));
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('No se pudo leer la imagen.'));
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 480, sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        try { res(c.toDataURL('image/jpeg', 0.8)); } catch (e) { rej(e); }
      };
      img.onerror = () => rej(new Error('Formato de imagen no compatible.'));
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

      if (val('confirm-typed').trim().toUpperCase() !== 'BORRAR') { toast('Escribe BORRAR para confirmar.'); return false; }
      store.del(dataKey(meta.mode)); for (const k of store.keys(photoPrefix(meta.mode))) store.del(k);
      store.blocked = false; loadProblem = null; D = meta.mode === 'demo' ? makeDemo() : emptyData(); photos = {}; save(); resetUi(); toast('Datos borrados'); render();
    });
  },
  'confirm-yes'() { const sh = topSheet('confirm'); const fn = confirmFns.get(sh.fnId); const r = fn ? fn() : undefined; if (r === false) return; confirmFns.delete(sh.fnId); ui.sheets = ui.sheets.filter(s => s !== sh); renderSheets(); render(false); },
  async 'copy-link'() {
    try { await navigator.clipboard.writeText(appUrl()); toast('Enlace copiado. Envíatelo al iPhone y ábrelo en Safari.'); }
    catch (e) { const r = document.createRange(); r.selectNodeContents($('#app-url')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('No se pudo copiar automáticamente. El enlace está seleccionado: cópialo a mano.', 'error'); }
  },
  'sheet-close'() { closeSheet(); }
};
function resetUi() { const t = todayKey(); Object.assign(ui, { date: t, hoyMonth: ymOf(t), calMonth: ymOf(t), editFrom: t, rDay: dow(t), open: {}, sheets: [], skinOpen: false }); renderSheets(); }
// Conserva lo escrito en el formulario de producto al re-dibujar la hoja
function keepForm(fn) {
  const ids = ['p-name', 'p-brand', 'p-cat', 'p-instr', 'p-notes', 'p-opened', 'p-pao'], v = {};
  ids.forEach(i => { const el = document.getElementById(i); if (el) v[i] = el.value; });
  fn(); ids.forEach(i => { const el = document.getElementById(i); if (el && i in v) el.value = v[i]; });
}

/* ---------- eventos ---------- */
let skinTimer = null, nameTimer = null;
document.addEventListener('click', e => {
  const bg = e.target.closest('[data-bg]'); if (bg && e.target === bg) { closeSheet(); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheets.length) closeSheet(); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'skin-notes') { const date = t.dataset.date; clearTimeout(skinTimer); skinTimer = setTimeout(() => { const L = D.logs[date] || (D.logs[date] = {}); (L.skin || (L.skin = {})).notes = t.value; save(); }, 400); }
  if (t.id === 'y-name') { clearTimeout(nameTimer); nameTimer = setTimeout(() => { D.profile.name = t.value.trim(); save(); }, 400); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'r-from') { if (isKey(t.value)) { ui.editFrom = t.value; render(); } return; }
  if (t.id === 'y-goal') { const n = Math.max(0, Math.min(100, Math.round(Number(t.value) || 0))); t.value = n; D.profile.goal = n; save(); return; }
  if (t.id === 'y-start') { if (isKey(t.value) && t.value <= todayKey()) {
      const old = D.profile.trackingStart, first = D.plans[0]; let extra = '';
      if (first && first.from === old && t.value < old) { first.from = t.value; extra = '. Tu primera planificación también se aplica desde esa fecha'; }
      D.profile.trackingStart = t.value; save(); toast('Inicio del seguimiento: ' + fmtShort(t.value) + extra); } else { t.value = D.profile.trackingStart; toast('Elige una fecha que no sea futura.'); } return; }
  if (t.id === 'y-am' || t.id === 'y-pm') { if (t.value) { D.profile.reminders[t.id === 'y-am' ? 'am' : 'pm'] = t.value; save(); } return; }
  if (t.id === 'y-name') { clearTimeout(nameTimer); D.profile.name = t.value.trim(); save(); return; }
  if (t.id === 'skin-notes') { clearTimeout(skinTimer); const L = D.logs[t.dataset.date] || (D.logs[t.dataset.date] = {}); (L.skin || (L.skin = {})).notes = t.value; save(); return; }
  if (t.id === 'p-photo' && t.files[0]) {
    try { const url = await readImage(t.files[0]); const sh = topSheet('product'); sh.newPhoto = url; sh.removePhoto = false; keepForm(renderSheets); }
    catch (err) { toast(err.message || 'No se pudo usar la imagen.', 'error'); } return;
  }
  if (t.id === 'y-avatar' && t.files[0]) {
    try { const url = await readImage(t.files[0]); const id = savePhoto(url); if (id) { deletePhoto(D.profile.avatar); D.profile.avatar = id; save(); render(); } }
    catch (err) { toast(err.message || 'No se pudo usar la imagen.', 'error'); } return;
  }
  if (t.id === 'y-import' && t.files[0]) {
    const file = t.files[0]; t.value = '';
    try { reviewImport(await file.text()); } catch (err) { toast('No se pudo leer el archivo.', 'error'); } return;
  }
});
function checkDay() {
  const t = todayKey();
  if (t === ui.lastToday) return;
  if (ui.date === ui.lastToday) { ui.date = t; ui.hoyMonth = ymOf(t); }
  if (ui.editFrom === ui.lastToday) ui.editFrom = t;
  if (ui.calMonth === ymOf(ui.lastToday)) ui.calMonth = ymOf(t);
  ui.lastToday = t; render();
}
setInterval(checkDay, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDay(); });
window.addEventListener('focus', checkDay);
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('controllerchange', () => { if (ui.tab === 'yo') render(); });
window.addEventListener('storage', e => { if (e.key === dataKey(meta.mode)) { loadData(meta.mode); render(); } });

/* ---------- arranque ---------- */
store.init(); loadMeta(); applyMeta(); loadData(meta.mode);
ui.tab = 'hoy';
render();
// Acceso para pruebas automáticas (no visible en la interfaz)
window.MiSkincare = { dayInfo: d => dayInfo(d), get data() { return D; }, get meta() { return meta; }, todayKey, version: APP_VERSION };

})();
</script>

  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
